name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A newer push to the same branch, pull request or tag supersedes a run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Actions are pinned to full commit SHAs, since a tag can be moved to other code; the comment names the tag.
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # Decky Loader 3.3 bundles Python 3.14 for the backend.
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from packageManager in package.json. v6 of this action needs pnpm 11 or newer.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The major version scripts/node.sh runs locally.
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/index.js
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against the package versions
        run: |
          npm_version="$(jq -r .version package.json)"
          py_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_NAME" != "v$npm_version" || "$GITHUB_REF_NAME" != "v$py_version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME, package.json $npm_version, pyproject.toml $py_version: all three must match"
            exit 1
          fi
      - name: Take the release notes from the changelog
        run: |
          # The lines under "## [X.Y.Z]" up to the next "## [" heading or the link definitions at the end.
          awk -v heading="## [${GITHUB_REF_NAME#v}]" '
            /^## \[/ { if (found) exit; if (index($0, heading) == 1) { found = 1; next } }
            found && /^\[[^]]*\]: / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: dev/package.sh out
      # The release asset carries its version, such as decky-armada-trackpad-0.1.0.zip.
      - run: mv out/decky-armada-trackpad.zip "out/decky-armada-trackpad-${GITHUB_REF_NAME#v}.zip"
      - run: >-
          gh release create "$GITHUB_REF_NAME" "out/decky-armada-trackpad-${GITHUB_REF_NAME#v}.zip"
          --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
